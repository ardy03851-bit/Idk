<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Studio</title>
<style>
:root{
  --bg:#0b0e14;--panel:#11151c;--panel2:#161b24;--panel3:#1c222e;
  --line:#232936;--line2:#2d3543;
  --txt:#d4dae6;--dim:#7e879a;--dim2:#55606f;
  --accent:#5b9dff;--accent2:#a78bfa;
  --ok:#4ade80;--warn:#fbbf24;--err:#f87171;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;user-select:none}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a3341;border-radius:4px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#3a4553;background-clip:padding-box;border:2px solid transparent}

#app{display:flex;flex-direction:column;height:100%;height:100dvh}

/* TOPBAR */
#topbar{height:46px;flex:none;display:flex;align-items:center;gap:3px;padding:0 8px;border-bottom:1px solid var(--line);background:var(--panel);z-index:50;padding-top:env(safe-area-inset-top)}
.tb-brand{display:flex;align-items:center;padding:0 10px 0 6px;color:var(--accent)}
.tb-actions{display:flex;align-items:center;gap:1px}
.tb-spacer{flex:1}
.btn{height:32px;min-width:32px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;color:var(--dim);font-size:13px;transition:background .15s,color .15s,transform .08s}
.btn:hover{background:var(--panel3);color:var(--txt)}
.btn:active{transform:scale(.94)}
.btn.icon{padding:0;width:32px}
.btn.on{background:rgba(91,157,255,.15);color:var(--accent)}
.btn.ghost{background:var(--panel3);color:var(--txt)}
.btn.ghost:hover{background:var(--line2)}
.btn svg{display:block}

/* MAIN */
#main{flex:1;display:flex;min-height:0;position:relative;overflow:hidden}

/* RAIL */
#rail{width:52px;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-right:1px solid var(--line);background:var(--panel)}
.rail-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--dim);position:relative;transition:background .15s,color .15s,transform .08s}
.rail-btn:hover{background:var(--panel3);color:var(--txt)}
.rail-btn:active{transform:scale(.94)}
.rail-btn.active{background:var(--panel3);color:var(--accent)}
.rail-btn.active::before{content:"";position:absolute;left:-7px;top:9px;bottom:9px;width:3px;border-radius:0 2px 2px 0;background:var(--accent)}
.rail-spacer{flex:1}
.rail-btn .dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--err);display:none}
.rail-btn.has-err .dot{display:block}

/* PANEL */
#panel{width:280px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);overflow:hidden;transition:width .25s cubic-bezier(.2,.8,.3,1)}
#panel.collapsed{width:0;border-right:0}
#panel-head{height:38px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px 0 12px;border-bottom:1px solid var(--line);min-width:280px}
#panel-title{flex:1;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2)}
#panel-actions{display:flex;gap:1px}
#panel-body{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;min-width:280px}
.panel-view{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel-view.hidden{display:none}

/* TREE */
#tree{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 4px 40px}
.node{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:7px;color:var(--dim);cursor:pointer;user-select:none;position:relative;transition:background .12s,color .12s}
.node:hover{background:var(--panel3);color:var(--txt)}
.node.active{background:rgba(91,157,255,.14);color:var(--accent)}
.node.active::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:2px;border-radius:0 2px 2px 0;background:var(--accent)}
.node .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.node .chev{width:12px;height:12px;flex:none;transition:transform .18s;opacity:.6;display:flex;align-items:center;justify-content:center}
.node:not(.collapsed) .chev{transform:rotate(90deg)}
.node .acts{display:none;gap:1px}
.node:hover .acts{display:flex}
.node .acts button{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--dim2)}
.node .acts button:hover{background:var(--line2);color:var(--txt)}
.node .badge{font-size:8.5px;font-weight:700;letter-spacing:.06em;color:var(--ok);padding:1px 4px;border-radius:3px;background:rgba(74,222,128,.12)}
.c-html{color:#e8734a}.c-css{color:#4aa3e8}.c-js{color:#e8c44a}
.c-img{color:#a78bfa}.c-media{color:#f472b6}.c-zip{color:#94a3b8}.c-file{color:#8b94a6}

/* SEARCH */
.search-form{padding:8px;display:flex;flex-direction:column;gap:6px}
.inp{height:30px;padding:0 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line2);color:var(--txt);font-size:12.5px;outline:none;transition:border-color .15s,box-shadow .15s;width:100%;min-width:0}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,157,255,.15)}
.inp::placeholder{color:var(--dim2)}
.search-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:5px;color:var(--dim);font-size:11px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent)}
#results{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px}
.res{display:flex;gap:8px;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12px;align-items:baseline}
.res:hover{background:var(--panel3)}
.res .rf{color:var(--dim2);font-size:10.5px;flex:none;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .rl{color:var(--dim2);font-size:10.5px;flex:none}
.res .rt{font-family:var(--mono);color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.res .rt mark{background:rgba(91,157,255,.3);color:var(--txt);border-radius:2px}
.empty{padding:22px 10px;text-align:center;color:var(--dim2);font-size:12px}

/* VARS */
.vars-head{padding:8px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim2)}
#vars-list{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 8px 40px}
.var-row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px}
.var-row:hover{background:var(--panel3)}
.var-sw{width:20px;height:20px;border-radius:5px;flex:none;border:1px solid rgba(255,255,255,.12);overflow:hidden;background-image:linear-gradient(45deg,#222 25%,transparent 25%,transparent 75%,#222 75%),linear-gradient(45deg,#222 25%,transparent 25%,transparent 75%,#222 75%);background-size:8px 8px;background-position:0 0,4px 4px}
.var-sw i{display:block;width:100%;height:100%}
.var-name{font-family:var(--mono);font-size:11.5px;color:var(--accent);flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.var-val{flex:1;min-width:0;height:24px;padding:0 6px;border-radius:5px;background:var(--bg);border:1px solid var(--line2);color:#9ece6a;font-family:var(--mono);font-size:11.5px;outline:none}
.var-val:focus{border-color:var(--accent)}
.var-file{font-size:10px;color:var(--dim2);flex:none;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* CONSOLE */
.console-head{padding:8px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim2)}
.badge{font-size:10px;padding:1px 7px;border-radius:9px;background:rgba(248,113,113,.15);color:var(--err);font-weight:600}
.badge.ok{background:rgba(74,222,128,.12);color:var(--ok)}
#console{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:4px 0;font-family:var(--mono);font-size:11.5px}
.cmsg{display:flex;gap:8px;padding:6px 10px;border-bottom:1px solid var(--panel3)}
.cmsg .cb{flex:1;min-width:0}
.cmsg .cm{word-break:break-word;white-space:pre-wrap;line-height:1.5}
.cmsg .cf{font-size:10.5px;color:var(--dim2);margin-top:4px}
.cmsg .cf a{color:var(--accent);cursor:pointer}
.cmsg .fix{margin-top:6px;padding:6px 8px;border-radius:6px;background:rgba(91,157,255,.1);border-left:2px solid var(--accent);color:#a0c0e8;font-family:var(--sans);font-size:11.5px;line-height:1.5}
.cmsg.error .cm{color:var(--err)}
.cmsg.warn .cm{color:var(--warn)}
.cmsg.log .cm{color:var(--dim)}
.cmsg.info .cm{color:var(--accent)}

/* EDITOR */
#editor-panel{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
#tabbar{height:36px;flex:none;display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;border-bottom:1px solid var(--line);background:var(--panel);scrollbar-width:none}
#tabbar::-webkit-scrollbar{height:0}
.tab{display:flex;align-items:center;gap:6px;padding:0 8px 0 12px;max-width:180px;flex:none;border-right:1px solid var(--line);color:var(--dim);font-size:12px;position:relative;transition:background .15s,color .15s}
.tab:hover{background:var(--panel2);color:var(--txt)}
.tab.active{background:var(--bg);color:var(--txt)}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
.tab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .x{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;opacity:.5;flex:none}
.tab .x:hover{background:var(--panel3);opacity:1}

#editor-wrap{flex:1;display:flex;min-height:0;position:relative}
#gutter{width:52px;flex:none;overflow:hidden;position:relative;background:var(--bg);border-right:1px solid var(--panel2)}
#gutter-inner{position:absolute;top:0;left:0;right:0;padding:12px 10px 12px 0;text-align:right;font-family:var(--mono);font-size:13px;line-height:1.6;color:#3d4756;white-space:pre;will-change:transform}
.codewrap{flex:1;position:relative;min-width:0}
#hl,#code{position:absolute;inset:0;margin:0;padding:12px 18px 40vh;font-family:var(--mono);font-size:13px;line-height:1.6;white-space:pre;tab-size:2;border:0;outline:none;overflow:auto;-webkit-overflow-scrolling:touch}
#hl{pointer-events:none;overflow:hidden;z-index:1}
#hl-inner{white-space:pre;font-family:var(--mono);font-size:13px;line-height:1.6;color:#c3ccdb;will-change:transform}
#code{z-index:2;background:transparent;-webkit-text-fill-color:transparent;color:transparent;caret-color:var(--accent);resize:none}
#code::selection{background:rgba(91,157,255,.3)}

/* syntax */
#hl-inner .c{color:#5c6a7d;font-style:italic}
#hl-inner .s{color:#9ece6a}
#hl-inner .n{color:#ff9e64}
#hl-inner .k{color:#bb9af7}
#hl-inner .f{color:#7aa2f7}
#hl-inner .a{color:#e0af68}
#hl-inner .t{color:#f7768e}
#hl-inner .p{color:#565f89}
#hl-inner .v{color:#73daca}
#hl-inner .sel{color:#7dcfff}

#binary-view{position:absolute;inset:0;z-index:3;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;overflow:auto;background:var(--bg)}
#binary-view.show{display:flex}
#binary-view img,#binary-view video{max-width:100%;max-height:70%;border-radius:10px;border:1px solid var(--line)}
#binary-view audio{width:80%;max-width:400px}
#binary-view .meta{font-size:12px;color:var(--dim);text-align:center;word-break:break-all}

/* PREVIEW */
.splitter{width:5px;flex:none;cursor:col-resize;background:transparent;position:relative;z-index:20;touch-action:none}
.splitter::after{content:"";position:absolute;inset:0 2px;border-radius:2px;background:transparent;transition:background .15s}
.splitter:hover::after,.splitter.drag::after{background:var(--accent)}
#preview-panel{width:420px;flex:none;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);transition:width .25s cubic-bezier(.2,.8,.3,1)}
#preview-panel.collapsed{width:0;border-left:0;overflow:hidden}
#preview-head{height:38px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px 0 12px;border-bottom:1px solid var(--line);min-width:220px}
#preview-head .ph-title{flex:1;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2)}
.ph-actions{display:flex;gap:1px}
#preview-body{flex:1;min-height:0;background:#000;display:flex;position:relative;min-width:220px}
#preview{flex:1;border:0;background:#fff;width:100%;height:100%;display:block}

/* STATUS */
#statusbar{height:26px;flex:none;display:flex;align-items:center;gap:14px;padding:0 12px;border-top:1px solid var(--line);background:var(--panel);font-size:11px;color:var(--dim);padding-bottom:env(safe-area-inset-bottom)}
#statusbar .tb-spacer{flex:1}
.status-item{background:none;border:0;color:inherit;font-size:11px;cursor:pointer;padding:0;display:inline-flex;align-items:center;gap:4px}
#status-file{font-family:var(--mono);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status-cursor{font-family:var(--mono)}
.err-ok{color:var(--dim)}
.err-bad{color:var(--err);font-weight:600}
.saved-ok{color:var(--ok)}
.saved-dirty{color:var(--warn)}

/* MENU */
#menu{position:fixed;z-index:950;min-width:172px;padding:5px;border-radius:11px;background:var(--panel2);border:1px solid var(--line2);box-shadow:0 20px 50px -12px #000;display:none}
#menu.show{display:block;animation:menuIn .15s ease}
@keyframes menuIn{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
.mi{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;font-size:12.5px;color:var(--txt);width:100%;text-align:left;transition:background .1s}
.mi:hover{background:var(--panel3)}
.mi.danger{color:var(--err)}
.mi svg{opacity:.7;flex:none}
.msep{height:1px;background:var(--line);margin:4px 6px}

/* TOASTS */
#toasts{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:900;pointer-events:none;align-items:center}
.toast{padding:9px 16px;border-radius:11px;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);font-size:12.5px;box-shadow:0 12px 34px -12px #000;animation:toastIn .28s cubic-bezier(.2,.9,.3,1);max-width:80vw;text-align:center}
.toast.err{border-color:rgba(248,113,113,.4);background:rgba(60,20,20,.95);color:#ffa8a8}
.toast.ok{border-color:rgba(74,222,128,.4);background:rgba(20,45,25,.95);color:#9ae6a3}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}

/* DROP ZONE */
#drop-zone{position:fixed;inset:0;z-index:990;background:rgba(6,10,18,.85);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;pointer-events:none}
#drop-zone.show{display:flex}
#drop-zone .dz{border:2px dashed #3a4a66;border-radius:18px;padding:44px 64px;color:#9db4d6;font-size:15px;text-align:center}

/* FULLSCREEN */
#fs-overlay{position:fixed;inset:0;z-index:800;background:#000;display:none;flex-direction:column}
#fs-overlay.show{display:flex}
#fs-bar{height:44px;flex:none;display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
#fs-frame{flex:1;border:0;background:#fff}

.hidden{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="tb-brand">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    </div>
    <div class="tb-actions">
      <button class="btn" id="btn-import" title="Import files or .zip">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <button class="btn" id="btn-export" title="Export">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="btn" id="btn-save" title="Save project">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      </button>
    </div>
    <div class="tb-spacer"></div>
    <button class="btn" id="btn-run" title="Run preview">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    </button>
    <button class="btn" id="btn-popup" title="Open preview in new window">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </button>
  </header>

  <div id="main">
    <nav id="rail">
      <button class="rail-btn active" data-tool="files" title="Files">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button class="rail-btn" data-tool="search" title="Search &amp; Replace">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <button class="rail-btn" data-tool="vars" title="CSS Variables">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      </button>
      <div class="rail-spacer"></div>
      <button class="rail-btn" data-tool="console" title="Console">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        <span class="dot" id="rail-console-dot"></span>
      </button>
    </nav>

    <aside id="panel">
      <div id="panel-head">
        <span id="panel-title">Files</span>
        <div id="panel-actions"></div>
      </div>
      <div id="panel-body">
        <div class="panel-view" data-view="files"><div id="tree"></div></div>
        <div class="panel-view hidden" data-view="search">
          <div class="search-form">
            <input class="inp" id="q" placeholder="Search in all files…" autocapitalize="off" autocorrect="off">

function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = ''; const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(bin);
}

const extOf = p => { const i = p.lastIndexOf('.'); return i < 0 ? '' : p.slice(i + 1).toLowerCase(); };

const dirOf = p => { const i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i); };

/* ============================ PERSIST ============================ */
const persist = debounce(() => {
  try {
    localStorage.setItem(KEY, JSON.stringify({ files: FILES, entry: entryPath, tabs: openTabs, active: activePath }));
    dirty = false; updateSavedBadge();
  } catch (e) {
    dirty = true; updateSavedBadge();

  }
}, 700);

function saveNow(){
  syncActiveFile();
  try {
    localStorage.setItem(KEY, JSON.stringify({ files: FILES, entry: entryPath, tabs: openTabs, active: activePath }));
    dirty = false; updateSavedBadge();
    return true;

    return false;

}

function loadProject(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) {}
  if (raw) {
    try {
      const d = JSON.parse(raw);
      if (d && d.files && Object.keys(d.files).length) {
        FILES = d.files;
        entryPath = d.entry || pickEntry();
        openTabs = (d.tabs || []).filter(t => FILES[t]);
        activePath = (d.active && FILES[d.active]) ? d.active : (openTabs[0] || null);
        return;
      }
    } catch (e) {}
  }
  FILES = JSON.parse(JSON.stringify(STARTER));
  entryPath = 'index.html';
  openTabs = ['index.html'];
  activePath = 'index.html';
}

function pickEntry(){
  const htmls = Object.keys(FILES).filter(p => /\.html?$/i.test(p) && !p.startsWith('__'));
  if (htmls.includes('index.html')) return 'index.html';
  return htmls[0] || Object.keys(FILES)[0] || null;
}

/* ============================ TREE ============================ */
function fileIconInfo(path){
  const e = extOf(path);
  if (['png','jpg','jpeg','gif','webp','svg','avif','bmp','ico','tiff','tif'].includes(e)) return ['image','c-img'];
  if (['mp4','webm','mov','ogv','m4v','mkv'].includes(e)) return ['film','c-media'];
  if (['mp3','wav','ogg','oga','m4a','flac','aac'].includes(e)) return ['music','c-media'];
  if (['zip','rar','7z','tar','gz'].includes(e)) return ['archive','c-zip'];
  if (['html','htm','xhtml'].includes(e)) return ['code','c-html'];
  if (['css','scss','sass','less','styl'].includes(e)) return ['css','c-css'];
  if (['js','mjs','cjs','jsx','ts','tsx','json','json5','jsonc'].includes(e)) return ['code','c-js'];
  if (['gltf','glb','fbx','stl','ply','obj'].includes(e)) return ['archive','c-media'];
  return ['file','c-file'];
}

function buildTree(paths){
  const root = { children:{}, files:[] };
  for (const p of paths){
    const parts = p.split('/');
    let node = root;
    for (let i = 0; i < parts.length - 1; i++){
      const name = parts[i];
      if (!node.children[name]) node.children[name] = { children:{}, files:[], path: parts.slice(0, i+1).join('/') };
      node = node.children[name];
    }
    node.files.push({ name: parts[parts.length-1], path: p });
  }
  return root;
}

function renderTree(){
  const tree = $('#tree');
  if (!tree) return;
  const scroll = tree.scrollTop;
  const paths = Object.keys(FILES).sort();
  const root = buildTree(paths);
  let html = '';
  function walkDir(node, depth){
    const dirs = Object.keys(node.children).sort((a,b)=>a.localeCompare(b));
    for (const d of dirs){
      const child = node.children[d];
      const isCollapsed = collapsedDirs.has(child.path);
      html += '<div class="node' + (isCollapsed ? ' collapsed' : '') + '" data-dir="' + esc(child.path) + '" style="padding-left:' + (6 + depth*13) + 'px">' +
        '<span class="chev">' + icon('chev', 12) + '</span>' +
        '<span class="ico c-file">' + icon('folder', 14) + '</span>' +
        '<span class="nm">' + esc(d) + '</span>' +
        '<span class="acts">' +
          '<button data-act="newfile-here" data-path="' + esc(child.path) + '" title="New file">' + icon('file2', 12) + '</button>' +
          '<button data-act="deldir" data-path="' + esc(child.path) + '" title="Delete folder">' + icon('trash', 12) + '</button>' +
        '</span></div>';
      if (!isCollapsed) walkDir(child, depth + 1);
    }
    node.files.sort((a,b)=>a.name.localeCompare(b.name));
    for (const f of node.files){
      const [ic, cls] = fileIconInfo(f.path);
      const active = f.path === activePath ? ' active' : '';
      html += '<div class="node' + active + '" data-file="' + esc(f.path) + '" style="padding-left:' + (10 + depth*13) + 'px">' +
        '<span class="ico ' + cls + '">' + icon(ic, 14) + '</span>' +
        '<span class="nm">' + esc(f.name) + '</span>' +
        (f.path === entryPath ? '<span class="badge">ENTRY</span>' : '') +
        '<span class="acts"><button data-act="filedel" data-path="' + esc(f.path) + '" title="Delete">' + icon('trash', 12) + '</button></span>' +
        '</div>';
    }
  }
  walkDir(root, 0);
  tree.innerHTML = html || '<div class="empty">No files yet</div>';
  tree.scrollTop = scroll;
}

$('#tree').addEventListener('click', e => {
  const actBtn = e.target.closest('[data-act]');
  if (actBtn){
    e.stopPropagation();
    const act = actBtn.dataset.act, p = actBtn.dataset.path;
    if (act === 'filedel') deletePath(p);
    else if (act === 'deldir') deleteDir(p);
    else if (act === 'newfile-here') newFile(p);
    return;
  }
  const fileEl = e.target.closest('[data-file]');
  if (fileEl){ openFile(fileEl.dataset.file); return; }
  const dirEl = e.target.closest('[data-dir]');
  if (dirEl){
    const p = dirEl.dataset.dir;
    if (collapsedDirs.has(p)) collapsedDirs.delete(p); else collapsedDirs.add(p);
    renderTree();
  }
});

$('#tree').addEventListener('contextmenu', e => {
  const fileEl = e.target.closest('[data-file]');
  if (!fileEl) return;
  e.preventDefault();
  const p = fileEl.dataset.file;
  showMenu(e.clientX, e.clientY, [
    { label:'Open', icon:'file', action: () => openFile(p) },

    { label:'Rename…', icon:'edit', action: () => renamePath(p) },

/* ============================ FILE OPS ============================ */
function uniquePath(p){
  if (!FILES[p]) return p;
  const dot = p.lastIndexOf('.');
  const base = dot < 0 ? p : p.slice(0, dot);
  const ext = dot < 0 ? '' : p.slice(dot);
  let i = 2;
  while (FILES[base + '-' + i + ext]) i++;
  return base + '-' + i + ext;
}

function newFile(parentDir){
  const name = prompt('New file name:', 'untitled.html');
  if (!name) return;
  const p = uniquePath((parentDir ? parentDir + '/' : '') + name.trim().replace(/^\/+/, ''));
  FILES[p] = { c: '' };
  renderTree(); openFile(p); persist();
}

function newFolder(){
  const name = prompt('New folder name:', 'assets');
  if (!name) return;
  const p = name.trim().replace(/^\/+|\/+$/g, '');
  if (!p) return;
  FILES[p + '/.keep'] = { c: '' };
  renderTree(); persist(); toast('Folder created', 'ok');
}

function deletePath(p){
  if (!confirm('Delete "' + p + '"?')) return;
  delete FILES[p];
  openTabs = openTabs.filter(t => t !== p);
  if (activePath === p) activePath = openTabs[0] || null;
  if (entryPath === p) entryPath = pickEntry();
  renderTree(); renderTabs(); loadIntoEditor(); schedulePreview(true); persist();
}

function deleteDir(dir){
  const victims = Object.keys(FILES).filter(p => p.startsWith(dir + '/'));
  if (!victims.length) return;
  if (!confirm('Delete folder "' + dir + '" and ' + victims.length + ' file(s)?')) return;
  victims.forEach(p => delete FILES[p]);
  openTabs = openTabs.filter(t => !victims.includes(t));
  if (!FILES[activePath]) activePath = openTabs[0] || null;
  if (!FILES[entryPath]) entryPath = pickEntry();
  renderTree(); renderTabs(); loadIntoEditor(); schedulePreview(true); persist();
}

function renamePath(p){
  const n = prompt('Rename to:', p);
  if (!n || n === p) return;
  const np = n.trim().replace(/^\/+/, '');
  if (FILES[np]) { toast('That name already exists', 'err'); return; }
  FILES[np] = FILES[p];
  delete FILES[p];
  openTabs = openTabs.map(t => t === p ? np : t);
  if (activePath === p) activePath = np;
  if (entryPath === p) entryPath = np;
  renderTree(); renderTabs(); loadIntoEditor(); schedulePreview(true); persist();
}

function duplicatePath(p){
  const np = uniquePath(p.replace(/(\.[^./]+)$/, '-copy$1'));
  FILES[np] = { c: FILES[p].c, b: FILES[p].b };
  renderTree(); persist(); toast('Duplicated', 'ok');
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}

function downloadFile(p){
  const f = FILES[p];
  if (!f) return;
  if (f.b){
    const comma = f.c.indexOf(',');
    const bytes = b64decodeToBytes(f.c.slice(comma + 1));
    downloadBlob(new Blob([bytes], { type: mimeFor(p) }), baseName(p));
  } else {
    downloadBlob(new Blob([f.c], { type: mimeFor(p) }), baseName(p));
  }
}

/* ============================ TABS ============================ */
function openFile(p){
  if (!FILES[p]) return;
  syncActiveFile();
  if (!openTabs.includes(p)) openTabs.push(p);
  activePath = p;
  renderTabs(); renderTree(); loadIntoEditor();
  updateStatusFile();
  persist();
}

function closeTab(p){
  syncActiveFile();
  openTabs = openTabs.filter(t => t !== p);
  if (activePath === p) activePath = openTabs[openTabs.length - 1] || null;
  renderTabs(); renderTree(); loadIntoEditor();
  updateStatusFile();
  persist();
}

function renderTabs(){
  const bar = $('#tabbar');
  bar.innerHTML = openTabs.map(p => {
    const [ic, cls] = fileIconInfo(p);
    return '<div class="tab' + (p === activePath ? ' active' : '') + '" data-tab="' + esc(p) + '">' +
      '<span class="' + cls + '" style="display:flex">' + icon(ic, 13) + '</span>' +
      '<span class="nm">' + esc(baseName(p)) + '</span>' +
      '<span class="x" data-close="' + esc(p) + '">' + icon('x', 12) + '</span></div>';
  }).join('');
}

$('#tabbar').addEventListener('click', e => {
  const closeBtn = e.target.closest('[data-close]');
  if (closeBtn){ closeTab(closeBtn.dataset.close); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab) openFile(tab.dataset.tab);
});

/* ============================ EDITOR ============================ */
const codeEl = $('#code');
const hlInner = $('#hl-inner');
const gutterInner = $('#gutter-inner');
const binaryView = $('#binary-view');

function syncActiveFile(){
  if (activePath && FILES[activePath] && !FILES[activePath].b && isText(activePath)){
    FILES[activePath].c = codeEl.value;
  }
}

function updateStatusFile(){
  const el = $('#status-file');
  el.textContent = activePath ? activePath : '—';
}

function loadIntoEditor(){
  if (!activePath || !FILES[activePath]){
    codeEl.value = ''; hlInner.innerHTML = ''; gutterInner.textContent = '1';
    binaryView.classList.remove('show'); codeEl.style.visibility = 'hidden';
    return;
  }
  const f = FILES[activePath];
  if (f.b || !isText(activePath)){
    binaryView.classList.add('show');
    codeEl.style.visibility = 'hidden';
    const mime = mimeFor(activePath);
    let inner = '';
    if (mime.startsWith('image/')) inner = '<img src="' + f.c + '" alt="">';
    else if (mime.startsWith('video/')) inner = '<video src="' + f.c + '" controls></video>';
    else if (mime.startsWith('audio/')) inner = '<audio src="' + f.c + '" controls></audio>';
    else inner = '<div style="color:var(--dim2)">' + icon('file', 44) + '</div>';
    binaryView.innerHTML = inner + '<div class="meta">' + esc(activePath) + '<br>' + mime + '</div>';
    return;
  }
  binaryView.classList.remove('show');
  codeEl.style.visibility = 'visible';
  codeEl.value = f.c;
  renderHighlight(true);
  codeEl.scrollTop = 0; codeEl.scrollLeft = 0;
  syncScroll();
  updateCursorPos();
}

/* ============================ HIGHLIGHT ============================ */
const JS_KW = 'const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|new|class|extends|super|this|typeof|instanceof|in|of|try|catch|finally|throw|async|await|yield|delete|void|import|export|from|as|default|static|get|set|true|false|null|undefined|NaN|Infinity|debugger';

const jsRe = new RegExp(
  '(\\/\\*[\\s\\S]*?\\*\\/|\\/\\/[^\\n]*)' +
  '|("(?:\\\\.|[^"\\\\\\n])*"|\'(?:\\\\.|[^\'\\\\\\n])*\'|`(?:\\\\.|[^`\\\\])*`)' +
  '|(\\b\\d[\\w.]*\\b)' +
  '|\\b(' + JS_KW + ')\\b' +
  '|([A-Za-z_$][\\w$]*)(?=\\s*\\()' +
  '|\\b(console|document|window|Math|JSON|Object|Array|String|Number|Promise|Date|Map|Set|localStorage|fetch)\\b',
  'g'
);

const cssRe = /(\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(--[\w-]+)|(#[0-9a-fA-F]{3,8}\b)|\b(\d+(?:\.\d+)?(?:px|em|rem|%|vh|vw|vmin|vmax|s|ms|deg|fr|pt|ch|ex)?)\b|(@[\w-]+)|([\w-]+)(?=\s*:)|([{}();:,])/g;

const htmlTagRe = /<!--[\s\S]*?-->|<\/?[a-zA-Z][\w:.-]*(?:"[^"]*"|'[^']*'|[^>])*>/g;
const htmlInnerRe = /(<\/?)([\w:.-]+)|([\w:.-]+)(\s*=\s*)("[^"]*"|'[^']*'|[^\s>]+)|(\/?>)/g;

function hlJS(src){
  let out = '', last = 0, m;
  jsRe.lastIndex = 0;
  while ((m = jsRe.exec(src))){
    if (m.index > last) out += esc(src.slice(last, m.index));
    const t = m[0];
    if (m[1]) out += '<span class="c">' + esc(t) + '</span>';
    else if (m[2]) out += '<span class="s">' + esc(t) + '</span>';
    else if (m[3]) out += '<span class="n">' + esc(t) + '</span>';
    else if (m[4]) out += '<span class="k">' + esc(t) + '</span>';
    else if (m[5]) out += '<span class="f">' + esc(t) + '</span>';
    else out += '<span class="v">' + esc(t) + '</span>';
    last = m.index + t.length;
  }
  out += esc(src.slice(last));
  return out;
}

function hlCSS(src){
  let out = '', last = 0, m;
  cssRe.lastIndex = 0;
  while ((m = cssRe.exec(src))){
    if (m.index > last) out += esc(src.slice(last, m.index));
    const t = m[0];
    if (m[1]) out += '<span class="c">' + esc(t) + '</span>';
    else if (m[2]) out += '<span class="s">' + esc(t) + '</span>';
    else if (m[3]) out += '<span class="v">' + esc(t) + '</span>';
    else if (m[4]) out += '<span class="n">' + esc(t) + '</span>';
    else if (m[5]) out += '<span class="n">' + esc(t) + '</span>';
    else if (m[6]) out += '<span class="k">' + esc(t) + '</span>';
    else if (m[7]) out += '<span class="sel">' + esc(t) + '</span>';
    else out += '<span class="p">' + esc(t) + '</span>';
    last = m.index + t.length;
  }
  out += esc(src.slice(last));
  return out;
}

function colorizeTag(tag){
  if (tag.startsWith('<!--')) return '<span class="c">' + esc(tag) + '</span>';
  let out = '', last = 0, m;
  htmlInnerRe.lastIndex = 0;
  while ((m = htmlInnerRe.exec(tag))){
    if (m.index > last) out += esc(tag.slice(last, m.index));
    if (m[1]) out += '<span class="p">' + esc(m[1]) + '</span><span class="t">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="a">' + esc(m[3]) + '</span>' + esc(m[4]) + '<span class="s">' + esc(m[5]) + '</span>';
    else out += '<span class="p">' + esc(m[6] || '') + '</span>';
    last = m.index + m[0].length;
  }
  out += esc(tag.slice(last));
  return out;
}

function hlHTML(src){
  let out = '', last = 0, m;
  htmlTagRe.lastIndex = 0;
  while ((m = htmlTagRe.exec(src))){
    if (m.index > last) out += esc(src.slice(last, m.index));
    out += colorizeTag(m[0]);
    last = m.index + m[0].length;
  }
  out += esc(src.slice(last));
  return out;
}

function highlight(src, path){
  const e = extOf(path);
  if (src.length > 200000) return esc(src);
  if (e === 'html' || e === 'htm' || e === 'xhtml' || e === 'xml' || e === 'svg') return hlHTML(src);
  if (e === 'css' || e === 'scss' || e === 'less' || e === 'sass') return hlCSS(src);
  if (['js','mjs','cjs','jsx','ts','tsx','json','json5','jsonc'].includes(e)) return hlJS(src);
  return esc(src);
}

function renderHighlight(){
  if (!activePath) return;
  const src = codeEl.value;
  hlInner.innerHTML = highlight(src, activePath) + '\n';
  const lines = src.split('\n').length;
  let g = '';
  for (let i = 1; i <= lines; i++) g += i + '\n';
  gutterInner.textContent = g;
  syncScroll();
}

function scheduleHighlight(){
  if (highlightTimer) cancelAnimationFrame(highlightTimer);
  highlightTimer = requestAnimationFrame(() => { highlightTimer = null; renderHighlight(); });
}

function syncScroll(){
  const top = codeEl.scrollTop, left = codeEl.scrollLeft;
  hlInner.style.transform = 'translate(' + (-left) + 'px,' + (-top) + 'px)';
  gutterInner.style.transform = 'translateY(' + (-top) + 'px)';
}
codeEl.addEventListener('scroll', syncScroll, { passive: true });

codeEl.addEventListener('input', () => {
  scheduleHighlight();
  dirty = true; updateSavedBadge();
  if (activePath && FILES[activePath] && !FILES[activePath].b){
    FILES[activePath].c = codeEl.value;
    persist();
  }
  updateCursorPos();
  if (autoRefresh) schedulePreview();
});

/* caret position tracking */
function updateCursorPos(){
  const pos = codeEl.selectionStart || 0;
  const before = codeEl.value.slice(0, pos);
  const lines = before.split('\n');
  const line = lines.length;
  const col = lines[lines.length - 1].length + 1;
  $('#status-cursor').textContent = 'Ln ' + line + ', Col ' + col;
}
codeEl.addEventListener('keyup', updateCursorPos);
codeEl.addEventListener('click', updateCursorPos);

/* key handling */
codeEl.addEventListener('keydown', e => {
  const start = codeEl.selectionStart, end = codeEl.selectionEnd;
  if (e.key === 'Tab'){
    e.preventDefault();
    insertText('  ');
    return;
  }
  const PAIRS = { '(' : ')', '[' : ']', '{' : '}', '"' : '"', "'" : "'", '`' : '`' };
  if (PAIRS[e.key] && start === end && !e.metaKey && !e.ctrlKey){
    const nextCh = codeEl.value[start] || '';
    if (nextCh === PAIRS[e.key]){
      e.preventDefault();
      codeEl.selectionStart = codeEl.selectionEnd = start + 1;
    } else {
      e.preventDefault();
      insertText(e.key + PAIRS[e.key]);
      codeEl.selectionStart = codeEl.selectionEnd = start + 1;
    }
    return;
  }
  if (e.key === 'Enter'){
    const lineStart = codeEl.value.lastIndexOf('\n', start - 1) + 1;
    const line = codeEl.value.slice(lineStart, start);
    const indent = (line.match(/^[ \t]*/) || [''])[0];
    const prevCh = codeEl.value[start - 1];
    if (/[{\[(]$/.test(prevCh)){
      e.preventDefault();
      insertText('\n' + indent + '  \n' + indent);
      const pos = start + 1 + indent.length + 2;
      codeEl.selectionStart = codeEl.selectionEnd = pos;
      return;
    }
    if (indent){
      e.preventDefault();
      insertText('\n' + indent);
      return;
    }
  }
});

function insertText(text){
  let ok = false;
  try { ok = document.execCommand('insertText', false, text); } catch (e) { ok = false; }
  if (!ok){
    const s = codeEl.selectionStart, en = codeEl.selectionEnd;
    codeEl.value = codeEl.value.slice(0, s) + text + codeEl.value.slice(en);
    codeEl.selectionStart = codeEl.selectionEnd = s + text.length;
    codeEl.dispatchEvent(new Event('input'));
  }
}

/* ============================ PREVIEW BUILD ============================ */
function resolvePath(baseDir, rel){
  if (!rel) return null;
  if (/^(https?:|data:|blob:|mailto:|tel:|#|\/\/|javascript:)/i.test(rel)) return null;
  let p = rel.split('?')[0].split('#')[0];
  if (!p) return null;
  const parts = (p.startsWith('/') ? [] : (baseDir ? baseDir.split('/') : [])).concat(p.split('/'));
  const out = [];
  for (const seg of parts){
    if (!seg || seg === '.') continue;
    if (seg === '..') out.pop();
    else out.push(seg);
  }
  const joined = out.join('/');
  return FILES[joined] ? joined : null;
}

function assetDataURL(p){
  const f = FILES[p];
  if (!f) return null;
  if (f.b) return f.c;
  return dataURL(f.c, mimeFor(p));
}

const MAX_DEPTH = 8;
const MAX_ASSET_MB = 4;

function inlineCSS(path, depth, problems){
  if (depth > MAX_DEPTH) return '';
  const f = FILES[path];
  if (!f) return '';
  const dir = dirOf(path);
  let css = f.c;
  css = css.replace(/@import\s+(?:url\(\s*)?['"]?([^'")\s;]+)['"]?\s*\)?\s*;/g, (m, ref) => {
    const r = resolvePath(dir, ref);
    if (r) return '\n/* inlined: ' + r + ' */\n' + inlineCSS(r, depth + 1, problems) + '\n';
    if (!/^https?:|^data:|^blob:/.test(ref)) problems.push({ kind:'missing', file:path, ref, where:'@import' });
    return m;
  });
  css = css.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, (m, q, ref) => {
    const r = resolvePath(dir, ref);
    if (r){
      const d = assetDataURL(r);
      return d ? 'url("' + d + '")' : m;
    }
    if (!/^(https?:|data:|blob:|#)/.test(ref)) problems.push({ kind:'missing', file:path, ref, where:'url()' });
    return m;
  });
  return css;
}

function inlineJS(path, depth, problems, stack){
  if (depth > MAX_DEPTH) return '';
  const f = FILES[path];
  if (!f) return '';
  const dir = dirOf(path);
  let js = f.c;
  js = js.replace(/(\bfrom\s*|\bimport\s*\(?\s*|\brequire\s*\(\s*)(['"])([^'"]+)\2/g, (m, pre, q, ref) => {
    const r = resolvePath(dir, ref);
    if (r){
      if (stack && stack.includes(r)){
        problems.push({ kind:'cycle', file:path, ref:r });
        return m;
      }
      const sub = inlineJS(r, depth + 1, problems, (stack || []).concat([r]));
      return pre + q + dataURL(sub + '\n//# sourceURL=' + r, 'text/javascript') + q;
    }
    if (!/^(https?:|data:|blob:)/.test(ref)) problems.push({ kind:'missing', file:path, ref, where:'import' });
    return m;
  });
  return js;
}

function inlineHTMLDoc(path, depth, problems){
  if (depth > MAX_DEPTH) return '';
  const f = FILES[path];
  if (!f) return '';
  const dir = dirOf(path);
  let html = f.c;

  html = html.replace(/<link\b[^>]*>/gi, tag => {
    if (!/rel\s*=\s*["']?stylesheet/i.test(tag)) return tag;
    const mm = tag.match(/href\s*=\s*["']([^"']+)["']/i);
    if (!mm) return tag;
    const r = resolvePath(dir, mm[1]);
    if (r) return '<style data-src="' + esc(r) + '">\n' + inlineCSS(r, depth + 1, problems) + '\n</style>';
    problems.push({ kind:'missing', file:path, ref:mm[1], where:'<link>' });
    return tag;
  });

  html = html.replace(/<script\b([^>]*)>\s*<\/script>/gi, (tag, attrs) => {
    const mm = attrs.match(/src\s*=\s*["']([^"']+)["']/i);
    if (!mm) return tag;
    const r = resolvePath(dir, mm[1]);
    if (r){
      const isModule = /type\s*=\s*["']?module/i.test(attrs);
      const body = inlineJS(r, depth + 1, problems, [r]);
      return '<script' + (isModule ? ' type="module"' : '') + ' data-src="' + esc(r) + '">\n' + body + '\n//# sourceURL=' + r + '\n<\/script>';
    }
    problems.push({ kind:'missing', file:path, ref:mm[1], where:'<script>' });
    return tag;
  });

  html = html.replace(/(\s)(src|href|poster)\s*=\s*(["'])([^"']+)\3/gi, (m, sp, attr, q, ref) => {
    const r = resolvePath(dir, ref);
    if (r){
      const d = assetDataURL(r);
      return d ? sp + attr + '=' + q + d + q : m;
    }
    if (!/^(https?:|data:|blob:|mailto:|tel:|#|\/\/|javascript:)/i.test(ref)) problems.push({ kind:'missing', file:path, ref, where:'<' + attr + '>' });
    return m;
  });

  return html;
}

const RUNTIME =
  '(function(){try{var P=window.parent;function S(t,d){try{P.postMessage({__studio:1,t:t,d:d},"*")}catch(e){}}' +
  'var C=window.console||{};["log","info","warn","error","debug"].forEach(function(k){var o=C[k];C[k]=function(){' +
  'var a=[];for(var i=0;i<arguments.length;i++){var v=arguments[i];try{a.push(typeof v==="object"?JSON.stringify(v):String(v))}catch(e){a.push(String(v))}}' +
  'S(k==="debug"?"log":k,a.join(" "));if(o)try{o.apply(C,arguments)}catch(e){}}});' +
  'window.addEventListener("error",function(e){' +
  'if(e.target&&e.target!==window&&e.target.tagName){var u="";try{u=e.target.src||e.target.href||""}catch(x){}' +
  'S("resource",JSON.stringify({tag:e.target.tagName.toLowerCase(),url:u}));return}' +
  'S("error",JSON.stringify({msg:e.message||"Script error",src:e.filename||"",line:e.lineno||0,col:e.colno||0,stack:(e.error&&e.error.stack)||""}))},true);' +
  'window.addEventListener("unhandledrejection",function(e){var r=e.reason||{};' +
  'S("error",JSON.stringify({msg:"Unhandled promise rejection: "+(r.message||String(r)),src:"",line:0,col:0,stack:r.stack||""}))});' +
  '})();';

function buildPreviewHTML(){
  const problems = [];
  let entry = entryPath;
  if (!entry || !FILES[entry]) entry = pickEntry();
  let html;
  if (!entry){
    html = '<!DOCTYPE html><html><body style="font-family:system-ui;color:#888;display:grid;place-items:center;height:100vh;margin:0">No files in workspace</body></html>';
  } else if (!/\.html?$/i.test(entry) && !/\.xhtml$/i.test(entry)){
    const body = inlineJS(entry, 0, problems, [entry]);
    html = '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<style>body{margin:0;font-family:system-ui;background:#0f1115;color:#e8ecf3;padding:16px}</style></head><body>' +
      '<script>' + RUNTIME + '<\/script><script>' + body + '<\/script></body></html>';
  } else {
    html = inlineHTMLDoc(entry, 0, problems);
  }
  // inject runtime safely (no literal </script> in this source)
  const runtimeTag = '<script>' + RUNTIME + '<\/script>';
  if (/<head[^>]*>/i.test(html)) html = html.replace(/<head[^>]*>/i, m => m + runtimeTag);
  else if (/<html[^>]*>/i.test(html)) html = html.replace(/<html[^>]*>/i, m => m + runtimeTag);
  else html = runtimeTag + html;
  return { html, problems, entry };
}

/* ============================ PREVIEW APPLY ============================ */
const schedulePreview = (immediate) => {
  if (previewTimer) clearTimeout(previewTimer);
  previewTimer = setTimeout(runPreview, immediate ? 0 : 650);
};

function runPreview(){
  let built;
  try { built = buildPreviewHTML(); }
  catch (e){
    addConsole('error', 'Preview build failed: ' + e.message, null, 0, 'Check for malformed HTML/JS in your files.');
    return;
  }
  lastPreviewHTML = built.html;
  clearStaticProblems();
  const seen = new Set();
  for (const p of built.problems){
    const key = p.file + '|' + p.ref;
    if (seen.has(key)) continue;
    seen.add(key);
    addConsole('warn',
      'Unresolved reference "' + p.ref + '" (' + p.where + ') in ' + p.file,
      p.file, 0,
      'Create "' + p.ref + '" in your workspace or fix the path (paths are case-sensitive).',
      'static');
  }
  const old = previewURL;
  previewURL = URL.createObjectURL(new Blob([built.html], { type: 'text/html' }));
  const frame = $('#preview');
  frame.onload = () => { if (old) setTimeout(() => URL.revokeObjectURL(old), 500); };
  frame.src = previewURL;
}

/* ============================ CONSOLE ============================ */
function clearStaticProblems(){
  $$('#console .cmsg[data-static="1"]').forEach(el => el.remove());
}

function addConsole(level, msg, file, line, fix, tag){
  const box = $('#console');
  if (!box) return;
  const el = document.createElement('div');
  el.className = 'cmsg ' + level;
  if (tag === 'static') el.dataset.static = '1';
  const ic = level === 'error' ? 'alert' : level === 'warn' ? 'warn' : level === 'info' ? 'info' : 'terminal';
  const color = level === 'error' ? 'var(--err)' : level === 'warn' ? 'var(--warn)' : level === 'info' ? 'var(--accent)' : 'var(--dim2)';
  let html = '<span style="color:' + color + ';flex:none;margin-top:2px">' + icon(ic, 12) + '</span><div class="cb">';
  html += '<div class="cm">' + esc(msg) + '</div>';
  if (fix) html += '<div class="fix">' + esc(fix) + '</div>';
  if (file){
    html += '<div class="cf"><span>' + esc(file) + (line ? ':' + line : '') + '</span>' +
      (line ? ' · <a data-goto="' + esc(file) + '|' + line + '">Go to line</a>' : '') + '</div>';
  }
  html += '</div>';
  el.innerHTML = html;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
  while (box.children.length > 250) box.removeChild(box.firstChild);
  if (level === 'error'){ errorCount++; updateErrBadge(); }
}

});

/* error explanations */
function explainError(msg){
  const m = String(msg || '');
  let r;
  if ((r = m.match(/^(?:Uncaught\s+)?(?:ReferenceError:\s*)?([\w$.]+) is not defined/)))
    return 'JavaScript can\u2019t find "' + r[1] + '". Either it\u2019s misspelled, in another scope, or defined later. Declare it before use.';
  if ((r = m.match(/Cannot read propert(?:y|ies) of (undefined|null)(?: \(reading '([^']+)'\))?/))){
    const prop = r[2] ? ' ".' + r[2] + '"' : '';
    return 'Something is ' + r[1] + ' when you tried to read' + prop + '. Common cause: querySelector() returned null. Guard with "if (x) { … }" and double-check the selector.';
  }
  if ((r = m.match(/([\w$.]+) is not a function/)))
    return '"' + r[1] + '" isn\u2019t callable. Check spelling, that it was defined/imported, and that you didn\u2019t overwrite it.';
  if (/Unexpected token|Unexpected end of input|Invalid or unexpected token|SyntaxError/.test(m))
    return 'Syntax error — a bracket, quote, or keyword is out of place near the reported line. Check matching { } and ( ).';
  if (/Assignment to constant variable/.test(m))
    return 'You tried to reassign a "const". Change it to "let" if it needs to change.';
  if (/Maximum call stack size exceeded/.test(m))
    return 'Infinite recursion. Add a base case to stop a function from calling itself forever.';
  if (/is not iterable/.test(m))
    return 'You used for…of / spread on something that isn\u2019t iterable. Log the value before the loop.';
  if (/Failed to fetch|NetworkError|Load failed/.test(m))
    return 'A network request failed. On iPad, local files can\u2019t be fetched via file:// — inline the data instead.';
  if (/QuotaExceeded|localStorage/.test(m))
    return 'Storage is full or blocked. Export a .zip to keep your work.';
  if (/NotAllowedError|permission/i.test(m))
    return 'The browser blocked an action that needs permission. It usually must be triggered by a direct tap/click.';
  return null;
}

/* messages from preview iframe */
window.addEventListener('message', e => {
  const d = e.data;
  if (!d || d.__studio !== 1) return;
  if (d.t === 'error'){
    let info = {};
    try { info = JSON.parse(d.d); } catch (err) { info = { msg: String(d.d) }; }
    let file = info.src || '';
    if (file.startsWith('blob:')) file = '';
    addConsole('error', info.msg, file || null, info.line || 0,
      explainError(info.msg) || 'Open the file at the reported line and inspect the values used.');
    return;
  }
  if (d.t === 'resource'){
    let info = {};
    try { info = JSON.parse(d.d); } catch (err) { return; }
    addConsole('error', 'Failed to load <' + info.tag + '> resource' + (info.url ? ': ' + info.url.slice(0, 80) : ''),
      null, 0, 'Check that the file exists in the workspace with the exact name and path.');
    return;
  }
  const lvl = (d.t === 'warn' || d.t === 'error' || d.t === 'info') ? d.t : 'log';
  addConsole(lvl, String(d.d), null, 0, null);
});

/* ============================ GOTO LINE ============================ */
function gotoLine(file, line){
  if (!FILES[file]) { toast('File not found: ' + file, 'err'); return; }
  openFile(file);
  setTimeout(() => {
    const lines = codeEl.value.split('\n');
    let pos = 0;
    for (let i = 0; i < Math.min(line - 1, lines.length); i++) pos += lines[i].length + 1;
    codeEl.focus();
    codeEl.selectionStart = pos;
    codeEl.selectionEnd = Math.min(pos + (lines[line - 1] || '').length, codeEl.value.length);
    const lh = 13 * 1.6;
    codeEl.scrollTop = Math.max(0, (line - 1) * lh - codeEl.clientHeight / 2);
    syncScroll();
    updateCursorPos();
  }, 60);
}

/* ============================ CSS VARS ============================ */
const COLOR_RE = /^(#[0-9a-fA-F]{3,8}|rgba?\([^)]*\)|hsla?\([^)]*\)|[a-zA-Z]+)$/;

function collectVars(){
  const out = [];
  for (const path of Object.keys(FILES)){
    const f = FILES[path];
    if (f.b) continue;
    if (/\.css$/i.test(path) || /\.scss$/i.test(path)) scanVars(f.c, 0, path, out);
    else if (/\.html?$/i.test(path)){
      const re = /<style[^>]*>([\s\S]*?)<\/style>/gi;
      let m;
      while ((m = re.exec(f.c))){
        const inner = m[1];
        const start = m.index + m[0].indexOf(inner);
        scanVars(inner, start, path, out);
      }
    }
  }
  return out;
}

function scanVars(text, base, path, out){
  const re = /(--[\w-]+)\s*:\s*([^;{}]+)(?=[;}])/g;
  let m;
  while ((m = re.exec(text))){
    const raw = m[2];
    const lead = raw.length - raw.trimStart().length;
    const val = raw.trim();
    if (!val) continue;
    const start = base + m.index + m[0].lastIndexOf(raw) + lead;
    out.push({ path, name: m[1], value: val, start, end: start + val.length });
  }
}

function renderVars(){
  const list = $('#vars-list');
  if (!list) return;
  const vars = collectVars();
  if (!vars.length){
    list.innerHTML = '<div class="empty">No CSS custom properties found.<br>Add <code>--my-var: value;</code> in a CSS file or &lt;style&gt; block.</div>';
    return;
  }
  list.innerHTML = vars.map((v, i) => {
    const isColor = COLOR_RE.test(v.value.trim());
    return '<div class="var-row">' +
      '<span class="var-sw"><i style="background:' + (isColor ? esc(v.value) : 'transparent') + '"></i></span>' +
      '<span class="var-name" title="' + esc(v.name) + '">' + esc(v.name) + '</span>' +
      '<input class="var-val" data-i="' + i + '" value="' + esc(v.value) + '" spellcheck="false">' +
      '<span class="var-file" title="' + esc(v.path) + '">' + esc(baseName(v.path)) + '</span></div>';
  }).join('');
  list.querySelectorAll('.var-val').forEach(inp => {
    const idx = +inp.dataset.i;
    const v = vars[idx];
    inp.addEventListener('input', () => {
      const sw = inp.parentElement.querySelector('.var-sw i');
      if (COLOR_RE.test(inp.value.trim())) sw.style.background = inp.value.trim();
    });
    inp.addEventListener('change', () => {
      const all = collectVars();
      const target = all.find(x => x.path === v.path && x.name === v.name);
      if (!target) return;
      const f = FILES[target.path];
      if (!f) return;
      f.c = f.c.slice(0, target.start) + inp.value.trim() + f.c.slice(target.end);
      if (activePath === target.path && isText(target.path)){
        codeEl.value = f.c; renderHighlight();
      }
      persist();
      if (autoRefresh) schedulePreview();
      toast('Updated ' + v.name, 'ok');
    });
  });
}
$('#btn-refresh-vars').addEventListener('click', renderVars);

/* ============================ SEARCH ============================ */
function buildRegex(){
  const q = $('#q').value;
  if (!q) return null;
  const flags = 'g' + ($('#qcase').checked ? '' : 'i');
  try {
    return new RegExp($('#qregex').checked ? q : q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), flags);
  } catch (e){ return null; }
}

const runSearch = debounce(() => {
  const re = buildRegex();
  const box = $('#results');
  if (!box) return;
  if (!re){ box.innerHTML = '<div class="empty">Type something to search.</div>'; return; }
  const results = [];
  for (const path of Object.keys(FILES)){
    const f = FILES[path];
    if (f.b || !isText(path)) continue;
    const lines = f.c.split('\n');
    for (let i = 0; i < lines.length; i++){
      re.lastIndex = 0;
      let m;
      while ((m = re.exec(lines[i]))){
        results.push({ path, line: i + 1, text: lines[i], index: m.index, len: m[0].length });
        if (m[0].length === 0) re.lastIndex++;
        if (results.length > 400) break;
      }
      if (results.length > 400) break;
    }
    if (results.length > 400) break;
  }
  if (!results.length){ box.innerHTML = '<div class="empty">No matches.</div>'; return; }
  box.innerHTML = results.slice(0, 300).map((r, i) => {
    const before = r.text.slice(0, r.index);
    const hit = r.text.slice(r.index, r.index + r.len);
    const after = r.text.slice(r.index + r.len);
    const trim = before.length > 60 ? '…' + before.slice(-60) : before;
    return '<div class="res" data-path="' + esc(r.path) + '" data-line="' + r.line + '">' +
      '<span class="rf">' + esc(baseName(r.path)) + '</span>' +
      '<span class="rl">' + r.line + '</span>' +
      '<span class="rt">' + esc(trim) + '<mark>' + esc(hit) + '</mark>' + esc(after.slice(0, 60)) + '</span></div>';
  }).join('');
}, 220);

$('#q').addEventListener('input', runSearch);
$('#qcase').addEventListener('change', runSearch);
$('#qregex').addEventListener('change', runSearch);

$('#results').addEventListener('click', e => {
  const row = e.target.closest('.res');
  if (!row) return;
  gotoLine(row.dataset.path, +row.dataset.line);
});

$('#btn-replaceall').addEventListener('click', () => {
  const re = buildRegex();
  if (!re){ toast('Invalid search', 'err'); return; }
  const rep = $('#qrep').value;
  let count = 0, files = 0;
  for (const path of Object.keys(FILES)){
    const f = FILES[path];
    if (f.b || !isText(path)) continue;
    const before = f.c;
    re.lastIndex = 0;
    const after = before.replace(re, () => { count++; return rep; });
    if (after !== before){ f.c = after; files++; }
  }
  if (activePath && FILES[activePath]){ codeEl.value = FILES[activePath].c; renderHighlight(); }
  persist(); if (autoRefresh) schedulePreview();
  runSearch();
  toast(count ? 'Replaced ' + count + ' in ' + files + ' file(s)' : 'Nothing to replace', count ? 'ok' : '');
});

/* ============================ ZIP ============================ */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

async function inflateRaw(bytes){
  if (typeof DecompressionStream === 'undefined') throw new Error('This browser cannot decompress .zip files.');
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function readZip(buffer){
  const dv = new DataView(buffer);
  const u8 = new Uint8Array(buffer);
  let eocd = -1;
  const minPos = Math.max(0, buffer.byteLength - 22 - 65535);
  for (let i = buffer.byteLength - 22; i >= minPos; i--){
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Not a valid .zip file');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const entries = [];
  for (let i = 0; i < count; i++){
    if (off + 46 > buffer.byteLength) break;
    if (dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize = dv.getUint32(off + 20, true);
    const nameLen = dv.getUint16(off + 28, true);
    const extraLen = dv.getUint16(off + 30, true);
    const cmtLen = dv.getUint16(off + 32, true);
    const lho = dv.getUint32(off + 42, true);
    const name = new TextDecoder().decode(u8.subarray(off + 46, off + 46 + nameLen));
    entries.push({ name, method, csize, lho });
    off += 46 + nameLen + extraLen + cmtLen;
  }
  const files = [];
  for (const en of entries){
    if (en.name.endsWith('/')) continue;
    if (en.name.startsWith('__MACOSX/') || en.name.includes('/.DS_Store')) continue;
    const lnameLen = dv.getUint16(en.lho + 26, true);
    const lextraLen = dv.getUint16(en.lho + 28, true);
    const dataStart = en.lho + 30 + lnameLen + lextraLen;
    const raw = u8.subarray(dataStart, dataStart + en.csize);
    let data;
    if (en.method === 0) data = raw;
    else if (en.method === 8) data = await inflateRaw(raw);
    else continue;
    files.push({ name: en.name, data });
  }
  return files;
}

function stripCommonRoot(files){
  const names = files.map(f => f.name);
  if (!names.length) return files;
  const firstSeg = names[0].split('/')[0];
  if (names.every(n => n.startsWith(firstSeg + '/'))) {
    return files.map(f => ({ name: f.name.slice(firstSeg.length + 1), data: f.data }));
  }
  return files;
}

function writeZip(entries){
  const enc = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;
  for (const e of entries){
    const nameBytes = enc.encode(e.name);
    const data = e.data;
    const crc = crc32(data);
    const size = data.length;
    const lh = new Uint8Array(30 + nameBytes.length);
    const ldv = new DataView(lh.buffer);
    ldv.setUint32(0, 0x04034b50, true);
    ldv.setUint16(4, 20, true);
    ldv.setUint16(6, 0, true);
    ldv.setUint16(8, 0, true);
    ldv.setUint16(10, 0, true);
    ldv.setUint16(12, 0x21, true);
    ldv.setUint32(14, crc, true);
    ldv.setUint32(18, size, true);
    ldv.setUint32(22, size, true);
    ldv.setUint16(26, nameBytes.length, true);
    ldv.setUint16(28, 0, true);
    lh.set(nameBytes, 30);
    chunks.push(lh, data);
    const ch = new Uint8Array(46 + nameBytes.length);
    const cdv = new DataView(ch.buffer);
    cdv.setUint32(0, 0x02014b50, true);
    cdv.setUint16(4, 20, true);
    cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0, true);
    cdv.setUint16(10, 0, true);
    cdv.setUint16(12, 0, true);
    cdv.setUint16(14, 0x21, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, size, true);
    cdv.setUint32(24, size, true);
    cdv.setUint16(28, nameBytes.length, true);
    cdv.setUint16(30, 0, true);
    cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true);
    cdv.setUint16(36, 0, true);
    cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);
    ch.set(nameBytes, 46);
    central.push(ch);
    offset += lh.length + size;
  }
  const centralSize = central.reduce((a, c) => a + c.length, 0);
  const eocd = new Uint8Array(22);
  const edv = new DataView(eocd.buffer);
  edv.setUint32(0, 0x06054b50, true);
  edv.setUint16(8, central.length, true);
  edv.setUint16(10, central.length, true);
  edv.setUint32(12, centralSize, true);
  edv.setUint32(16, offset, true);
  const all = chunks.concat(central, [eocd]);
  let total = 0;
  for (const c of all) total += c.length;
  const out = new Uint8Array(total);
  let p = 0;
  for (const c of all){ out.set(c, p); p += c.length; }
  return out;
}

/* ============================ IMPORT / EXPORT ============================ */
function fileToNode(name, bytes){
  const ext = extOf(name);
  const mime = MIME[ext] || '';
  if (TEXT_EXT.has(ext)){
    try {
      const text = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
      return { c: text };
    } catch (e) {}
  }
  let bin = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return { c: 'data:' + (mime || 'application/octet-stream') + ';base64,' + btoa(bin), b: true };
}

async function importZipFile(file){
  try {
    toast('Reading zip…');
    const buf = await file.arrayBuffer();
    let entries = await readZip(buf);
    entries = stripCommonRoot(entries);
    if (!entries.length){ toast('Zip was empty', 'err'); return; }
    const overwrite = Object.keys(FILES).length > 1 ? confirm('Replace the current workspace with the zip contents?\n\nCancel = merge into the current workspace.') : true;
    if (overwrite) FILES = {};
    for (const e of entries) FILES[e.name] = fileToNode(e.name, e.data);
    entryPath = pickEntry();
    openTabs = [entryPath].filter(Boolean);
    activePath = entryPath;
    renderTree(); renderTabs(); loadIntoEditor(); updateStatusFile();
    persist();
    runPreview();
    toast('Imported ' + entries.length + ' file(s)', 'ok');
  } catch (err){
    addConsole('error', 'Zip import failed: ' + err.message, null, 0, 'The archive may be corrupted or use an unsupported compression method.');
    toast('Zip import failed', 'err');
  }
}

function exportZip(){
  syncActiveFile();
  const enc = new TextEncoder();
  const entries = [];
  for (const path of Object.keys(FILES)){
    const f = FILES[path];
    let bytes;
    if (f.b){
      const comma = f.c.indexOf(',');
      bytes = b64decodeToBytes(f.c.slice(comma + 1));
    } else {
      bytes = enc.encode(f.c);
    }
    entries.push({ name: path, data: bytes });
  }
  const zip = writeZip(entries);
  downloadBlob(new Blob([zip], { type: 'application/zip' }), 'project-' + Date.now() + '.zip');
  toast('Exported .zip', 'ok');
}

function exportSingleHTML(){
  syncActiveFile();
  const built = buildPreviewHTML();
  const base = baseName(built.entry || 'site').replace(/\.[^.]+$/, '') || 'site';
  downloadBlob(new Blob([built.html], { type: 'text/html' }), base + '-bundle.html');
  toast('Exported single HTML file', 'ok');
}

function importFiles(fileList){
  const files = Array.from(fileList);
  if (!files.length) return;
  let pending = 0;
  const nonZip = files.filter(f => !/\.zip$/i.test(f.name));
  pending = nonZip.length;
  files.forEach(file => {
    if (/\.zip$/i.test(file.name)){ importZipFile(file); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const bytes = new Uint8Array(reader.result);
      let name = file.name;
      if (FILES[name]) name = uniquePath(name);
      FILES[name] = fileToNode(name, bytes);
      pending--;
      renderTree();
      if (pending === 0){
        if (!FILES[activePath]) { entryPath = pickEntry(); if (entryPath) openFile(entryPath); }
        persist(); if (autoRefresh) schedulePreview(true);
        toast('Imported ' + nonZip.length + ' file(s)', 'ok');
      }
    };
    reader.readAsArrayBuffer(file);
  });
}

/* ============================ MENUS ============================ */
function showMenu(x, y, items){
  const menu = $('#menu');
  menu.innerHTML = items.map((it, i) => {
    if (it.sep) return '<div class="msep"></div>';
    return '<button class="mi' + (it.danger ? ' danger' : '') + '" data-i="' + i + '">' +
      icon(it.icon || 'file', 14) + '<span>' + esc(it.label) + '</span></button>';
  }).join('');
  menu.classList.add('show');
  const w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = Math.min(x, window.innerWidth - w - 10) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - h - 10) + 'px';
  const handler = ev => {
    const b = ev.target.closest('[data-i]');
    if (b){
      const it = items[+b.dataset.i];
      hide();
      if (it && it.action) it.action();
    } else if (!ev.target.closest('#menu')) hide();
  };
  const hide = () => {
    menu.classList.remove('show');
    document.removeEventListener('pointerdown', handler, true);
  };
  setTimeout(() => document.addEventListener('pointerdown', handler, true), 0);
}

  showMenu(r.left, r.bottom + 6, [
    { label:'Export as single HTML', icon:'code', action: exportSingleHTML },
    { label:'Export project as .zip', icon:'zip', action: exportZip },
    { sep:true },
    { label:'Download current file', icon:'download', action: () => activePath && downloadFile(activePath) }
  ]);
});

$('#btn-save').addEventListener('click', () => { if (saveNow()) toast('Project saved', 'ok'); });

$('#btn-run').addEventListener('click', () => runPreview());
$('#btn-reload').addEventListener('click', () => runPreview());
$('#btn-live').addEventListener('click', e => {
  autoRefresh = !autoRefresh;
  e.currentTarget.classList.toggle('on', autoRefresh);
  toast(autoRefresh ? 'Auto refresh on' : 'Auto refresh off');
});

$('#btn-full').addEventListener('click', openFullscreen);
$('#btn-popup').addEventListener('click', openPopup);

function openPopup(){
  syncActiveFile();
  if (!lastPreviewHTML) runPreview();
  try {
    const url = URL.createObjectURL(new Blob([lastPreviewHTML], { type: 'text/html' }));
    const w = window.open(url, '_blank');
    if (!w) { openFullscreen(); return; }
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  } catch (e){
    openFullscreen();
  }
}

function openFullscreen(){
  syncActiveFile();
  if (!lastPreviewHTML) runPreview();
  $('#fs-frame').srcdoc = lastPreviewHTML;
  $('#fs-overlay').classList.add('show');
}
$('#fs-close').addEventListener('click', () => {
  $('#fs-overlay').classList.remove('show');
  $('#fs-frame').srcdoc = '';
});

/* rail */
$$('.rail-btn').forEach(b => b.addEventListener('click', () => setPanelTool(b.dataset.tool)));

/* ============================ SPLITTERS ============================ */
function initSplitter(el, target, side, min, max){
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    el.classList.add('drag');
    const startX = e.clientX;
    const startW = target.getBoundingClientRect().width;
    const move = ev => {
      const dx = ev.clientX - startX;
      let w = side === 'left' ? startW + dx : startW - dx;
      w = Math.max(min, Math.min(w, window.innerWidth - max));
      target.style.width = w + 'px';
    };
    const up = () => {
      el.classList.remove('drag');
      try { el.releasePointerCapture(e.pointerId); } catch (err) {}
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', up);
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  });
}
initSplitter($('#split-preview'), $('#preview-panel'), 'right', 240, 600);

/* ============================ DRAG & DROP ============================ */
let dragDepth = 0;
window.addEventListener('dragenter', e => {
  if (!e.dataTransfer || !Array.from(e.dataTransfer.types).includes('Files')) return;
  dragDepth++;
  $('#drop-zone').classList.add('show');
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('dragleave', () => {
  dragDepth = Math.max(0, dragDepth - 1);
  if (!dragDepth) $('#drop-zone').classList.remove('show');
});
window.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  $('#drop-zone').classList.remove('show');
  if (e.dataTransfer && e.dataTransfer.files.length) importFiles(e.dataTransfer.files);
});
$('#file-input').addEventListener('change', e => { importFiles(e.target.files); e.target.value = ''; });
$('#zip-input').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) importZipFile(f);
  e.target.value = '';
});

/* ============================ GLOBAL SHORTCUTS ============================ */
window.addEventListener('keydown', e => {
  const meta = e.metaKey || e.ctrlKey;
  if (!meta) return;
  const k = e.key.toLowerCase();
  if (k === 's'){ e.preventDefault(); if (saveNow()) toast('Saved', 'ok'); }
  else if (k === 'f'){ e.preventDefault(); setPanelTool('search'); }
  else if (k === 'p'){ e.preventDefault(); setPanelTool('vars'); }
  else if (k === 'enter'){ e.preventDefault(); runPreview(); }
});

/* ============================ BOOT ============================ */
function boot(){
  loadProject();
  if (!activePath && openTabs.length) activePath = openTabs[0];
  if (!activePath) activePath = pickEntry();
  if (!entryPath) entryPath = pickEntry();

  renderTree();
  renderTabs();
  loadIntoEditor();
  updateStatusFile();
  updateSavedBadge();
  updateErrBadge();
  setPanelTool('files');

  addConsole('info', 'Workspace ready · ' + Object.keys(FILES).length + ' file(s)', null, 0, null);

  setTimeout(runPreview, 150);
  setTimeout(() => { renderHighlight(); }, 300);
  setTimeout(() => { window.addEventListener('resize', syncScroll); }, 100);
}

window.addEventListener('beforeunload', () => {
  try {
    syncActiveFile();
    localStorage.setItem(KEY, JSON.stringify({ files: FILES, entry: entryPath, tabs: openTabs, active: activePath }));
  } catch (e) {}
});

boot();
</script>
</body>
